name: CI

on:
  push:
    branches: [master, main]
    tags: ['[0-9]*.[0-9]*.[0-9]*', 'v[0-9]*.[0-9]*.[0-9]*']
  pull_request:
  workflow_dispatch:

# Default to read-only token; jobs that need more should opt in explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The full Lego catalogue contains large cloud SDKs; bound compiler concurrency.
env:
  GOFLAGS: -p=2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: true
      - name: Reject legacy OpenPGP dependencies
        run: make check-deps-test check-deps
      - run: go vet ./...
      - run: go test -race -timeout 10m ./...
      - name: Check reachable dependency vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./cmd/apt-cacher-ultra
      # e2e/flat's test binary seam (cmd/apt-cacher-ultra/e2ehooks.go),
      # compiled only with this tag.
      - name: e2ehooks seam
        run: |
          go vet -tags e2ehooks ./cmd/apt-cacher-ultra/
          go test -tags e2ehooks -count=1 ./cmd/apt-cacher-ultra/
      - name: Verify portable Linux binary
        run: |
          CGO_ENABLED=1 make build
          if grep -q ACU_E2E_ build/apt-cacher-ultra; then
            echo "Release binary contains the e2e test seam (ACU_E2E_)" >&2
            exit 1
          fi
          buildinfo="$(go version -m build/apt-cacher-ultra)"
          if [[ "$buildinfo" == *-tags=*e2ehooks* ]]; then
            echo "Release binary was built with -tags e2ehooks" >&2
            exit 1
          fi
          program_headers="$(readelf --program-headers --wide build/apt-cacher-ultra)"
          if [[ "$program_headers" == *INTERP* ]]; then
            echo "Binary requires an external ELF interpreter" >&2
            exit 1
          fi
          dynamic_entries="$(readelf --dynamic --wide build/apt-cacher-ultra)"
          if [[ "$dynamic_entries" == *NEEDED* ]]; then
            echo "Binary requires external shared libraries" >&2
            exit 1
          fi
          ./build/apt-cacher-ultra -version

  acme-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: true
      - name: Install pinned local test authority
        run: |
          mkdir -p "$RUNNER_TEMP/pebble-bin"
          GOBIN="$RUNNER_TEMP/pebble-bin" go install github.com/letsencrypt/pebble/v2/cmd/pebble@v2.10.1
          GOBIN="$RUNNER_TEMP/pebble-bin" go install github.com/letsencrypt/pebble/v2/cmd/pebble-challtestsrv@v2.10.1
      - name: HTTP-01 and DNS-01 issuance, renewal, cleanup and offline restart
        run: ACU_PEBBLE_BIN_DIR="$RUNNER_TEMP/pebble-bin" go test -race -timeout 3m ./internal/acme -run TestPebbleInteroperability -count=1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          # Pin so CI is reproducible; bump deliberately rather than letting
          # `latest` drift behind your back. v2.x is required for Go 1.25
          # targets (v1.x was built with go1.23/1.24), and v2.14 or later
          # for the Go 1.27 toolchain: v2.12.2 cannot read Go 1.27's export
          # data ("export data version 5 is greater than maximum supported
          # version 4").
          version: v2.14.0
      # e2e/flat's test binary seam (cmd/apt-cacher-ultra/e2ehooks.go and
      # its test) compiles only with this tag, so the run above skips it.
      - name: golangci-lint (e2ehooks)
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          args: --build-tags e2ehooks ./cmd/...
      # The e2e harnesses and the package's maintainer scripts, among them
      # e2e/live/smoke.sh, which runs only by hand (the Makefile's
      # shellcheck target, which `make lint` runs too). It runs ShellCheck
      # from the pinned koalaman/shellcheck:v0.11.0 image, not the runner's:
      # ShellCheck versions differ in what they flag (0.9.0, the one
      # ubuntu-latest ships, flagged an SC2015 at e2e/flat/test.sh that the
      # local 0.11.0 did not), so CI and every checkout run the one version. -x follows each `source`
      # (e2e/flat/lib.sh, for both harnesses); without it ShellCheck reports
      # SC1091. It does not report an upper-case setting or a function a
      # sourced file stops defining.
      - name: shellcheck
        run: make shellcheck

  # SPEC §12.4 docker-compose end-to-end test. Slower lane (~2 min for
  # the docker build + apt-get update inside ubuntu:noble), but it's
  # the only thing that exercises real apt against the cache. ubuntu
  # GitHub runners ship with docker + docker compose preinstalled.
  e2e:
    runs-on: ubuntu-latest
    # Cap the job so a docker hang or apt-get retry storm does not
    # consume the full Actions per-job limit. Local runs complete in
    # ~30s; 10 min gives generous headroom for cold caches.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: bash e2e/run.sh

  # SPEC §14 step 3 .deb package install validation. For each
  # supported Ubuntu LTS target, a docker harness builds the .deb,
  # installs it on the target image, validates the package contract
  # (file layout, user, perms, unit syntax) and starts the daemon
  # under the packaged user. This is the gating check that the
  # release artifact actually works on supported targets.
  deb-test:
    runs-on: ubuntu-latest
    # Each target build is ~1-2 min cold; two targets + matrix
    # overhead fits comfortably in 15 min.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: bash e2e/deb/run.sh

  # Spec §7 real-apt end-to-end test of flat repositories
  # (e2e/flat/README.md): nginx, the daemon and apt clients in one
  # container, one job per client image so every apt version (2.2 to 3.2)
  # runs on every change. The rows with `unsigned: true` (the oldest and
  # newest images) also wait for the unsigned confirmation, 5 to 15
  # minutes after first contact; the others take about 2.5 minutes plus
  # the image build. Both the unsigned image list and the timeout derive
  # from that one boolean, so bumping a row's image cannot drop its
  # unsigned scenario. No retry: a flaky scenario must show. A failure
  # that names a distribution mirror is re-run alone.
  e2e-flat:
    name: e2e-flat (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: 'debian:11', unsigned: true }
          - { image: 'ubuntu:22.04', unsigned: false }
          - { image: 'ubuntu:24.04', unsigned: false }
          - { image: 'debian:12', unsigned: false }
          - { image: 'debian:13', unsigned: false }
          - { image: 'ubuntu:26.04', unsigned: true }
    timeout-minutes: ${{ matrix.unsigned && 30 || 15 }}
    steps:
      - uses: actions/checkout@v5
      # A job timeout signals the step's shell alone, which does not pass
      # it into the container, so the test's own failure output (the
      # scenario and both log tails) would be lost. timeout(1) instead
      # sends INT to the whole step's process group 3 minutes before the
      # job's limit (27 of 30, 12 of 15): docker run passes it into the
      # container, and test.sh's INT trap prints the tails once the command
      # it is running returns, since bash runs a trap only between commands:
      # normally within seconds, but a command stuck for good still loses
      # them (docker run relayed them in 6 of 7 local trials). -k 60 kills
      # what is left a minute later. The last 2 minutes cover the checkout
      # before this step and the runner's own overhead.
      - run: timeout -s INT -k 60 "${E2E_STEP_MINUTES}m" bash e2e/flat/run.sh
        env:
          E2E_FLAT_IMAGES: ${{ matrix.image }}
          E2E_FLAT_UNSIGNED_IMAGES: ${{ matrix.unsigned && matrix.image || '' }}
          E2E_STEP_MINUTES: ${{ matrix.unsigned && 27 || 12 }}

  # Fast unit tests for the apt-repo publishing scripts
  # (scripts/select-stable-tags.sh, scripts/build-apt-repo.sh). Docker-free
  # and self-skipping if tooling is absent; apt-ftparchive comes from
  # apt-utils (dpkg-deb, gpg, jq are already on the runner).
  apt-repo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y apt-utils
      - run: make apt-repo-test

  # Test both architectures without giving PR code a registry write token.
  docker:
    needs: [test, lint, acme-interop, e2e, deb-test, e2e-flat, apt-repo]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-latest, arch: amd64}
          - {runner: ubuntu-24.04-arm, arch: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          pull: true
          load: true
          platforms: linux/${{ matrix.arch }}
          tags: apt-cacher-ultra:smoke
          build-args: VERSION=sha-${{ github.sha }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}
      - name: Validate Compose example
        run: docker compose -f compose.yml config --quiet
      - name: Smoke test production image
        run: bash scripts/smoke-test-docker.sh apt-cacher-ultra:smoke
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: true
      - name: DNS provider worker under container restrictions
        run: |
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges:true apt-cacher-ultra:smoke acme dns-providers
          CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/acu-dns-provider.test" ./internal/acmedns
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges:true --mount "type=bind,source=$RUNNER_TEMP/acu-dns-provider.test,target=/run/provider.test,readonly" --entrypoint /run/provider.test apt-cacher-ultra:smoke -test.timeout=2m
      - name: Verified HTTPS healthcheck in optional image
        run: |
          docker compose -f compose.acme.yml config --quiet
          docker compose -f compose.acme-dns.yml config --quiet
          docker build -f docker/Dockerfile.acme --build-arg ACU_BASE_IMAGE=apt-cacher-ultra:smoke -t apt-cacher-ultra:tls-healthcheck .
          ACU_TLS_SMOKE_IMAGE=apt-cacher-ultra:tls-healthcheck go test -timeout 3m ./internal/servertls -run TestContainerHTTPSHealthcheck -count=1

  docker-publish:
    needs: [docker]
    # A manual run on a feature branch must not overwrite a deployment tag.
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Compute lowercase image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}
            type=sha
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: |
            type=gha,scope=docker-amd64
            type=gha,scope=docker-arm64
          cache-to: type=gha,mode=max,scope=docker-publish
